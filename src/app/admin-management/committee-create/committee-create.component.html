<div class="committee-create-container">
  <h2>Create Committee</h2>
  <form [formGroup]="committeeForm" class="committee-form">
    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Committee Name</mat-label>
        <input matInput formControlName="committee_name" placeholder="Enter committee name">
        <mat-error *ngIf="committeeForm.get('committee_name')?.hasError('required')">
          Committee name is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <div class="form-field half-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startDatePicker" formControlName="start_date" placeholder="Select start date">
          <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
          <mat-error *ngIf="committeeForm.get('start_date')?.hasError('required')">
            Start date is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-field half-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endDatePicker" formControlName="end_date" placeholder="Select end date">
          <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #endDatePicker></mat-datepicker>
          <mat-error *ngIf="committeeForm.get('end_date')?.hasError('required')">
            End date is required
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Created By</mat-label>
        <input matInput formControlName="created_by" placeholder="Enter creator name">
        <mat-error *ngIf="committeeForm.get('created_by')?.hasError('required')">
          Created by is required
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-actions">
      <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="committeeForm.invalid">
        Create Committee
      </button>
    </div>
  </form>
</div>
