<div class="user-create-container">
  <h2>Committee Administrator</h2>
  <form [formGroup]="userForm" class="user-form">
    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" placeholder="Enter username">
        <mat-error *ngIf="userForm.get('username')?.invalid">Username is required</mat-error>
      </mat-form-field>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="Enter email">
        <mat-error *ngIf="userForm.get('email')?.invalid">Valid email is required</mat-error>
      </mat-form-field>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" placeholder="Enter password">
        <mat-error *ngIf="userForm.get('password')?.invalid">Password is required</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <div class="form-field half-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mobile Number</mat-label>
          <input matInput formControlName="mobile_no" placeholder="10-digit number">
          <mat-error *ngIf="userForm.get('mobile_no')?.invalid">Valid number required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-field half-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Gender</mat-label>
          <mat-select formControlName="gender">
            <mat-option value="male">Male</mat-option>
            <mat-option value="female">Female</mat-option>
            <mat-option value="other">Other</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="address" placeholder="Enter address" rows="2"></textarea>
      </mat-form-field>
    </div>

    <div class="form-actions">
      <button mat-button (click)="onCancel()" class="">Cancel</button>
      <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="userForm.invalid">
        Create User
      </button>
    </div>
  </form>
</div>
