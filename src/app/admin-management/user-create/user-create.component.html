<div class="user-create-container">
  <mat-card class="user-card">
    <mat-card-header>
      <mat-card-title>Create New User</mat-card-title>
      <mat-card-subtitle>Fill in the details below</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">

        <!-- Username -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter username">
          <mat-error *ngIf="userForm.get('username')?.invalid">Username is required</mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Enter email">
          <mat-error *ngIf="userForm.get('email')?.invalid">Valid email is required</mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Enter password">
          <mat-error *ngIf="userForm.get('password')?.invalid">Password is required</mat-error>
        </mat-form-field>

        <!-- Address -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <textarea matInput formControlName="address" placeholder="Enter address"></textarea>
        </mat-form-field>

        <!-- Mobile Number -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mobile Number</mat-label>
          <input matInput formControlName="mobile_no" placeholder="Enter 10-digit mobile number">
          <mat-error *ngIf="userForm.get('mobile_no')?.invalid">Enter a valid mobile number</mat-error>
        </mat-form-field>

        <!-- Gender -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Gender</mat-label>
          <mat-select formControlName="gender">
            <mat-option value="male">Male</mat-option>
            <mat-option value="female">Female</mat-option>
            <mat-option value="other">Other</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Submit Button -->
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">
            Create User
          </button>
          <button mat-button type="reset" (click)="userForm.reset()">Reset</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
