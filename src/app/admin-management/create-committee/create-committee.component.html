<div class="committee-create-container">
  <h2>Create Committee</h2>
  <form [formGroup]="committeeForm" class="committee-form">
    <!-- Committee Name -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Committee Name</mat-label>
        <input matInput formControlName="committee_name" placeholder="Enter committee name" />
        <mat-error *ngIf="committeeForm.get('committee_name')?.hasError('required')">
          Committee name is required
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Start Date -->
    <div class="form-row">
      <div class="form-field half-width">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startDatePicker" formControlName="start_date"
            placeholder="Select start date" />
          <mat-datepicker-toggle matSuffix [for]="startDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #startDatePicker></mat-datepicker>
          <mat-error *ngIf="committeeForm.get('start_date')?.hasError('required')">
            Start date is required
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <!-- Committee Tenure -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Committee Tenure (Months)</mat-label>
        <input matInput type="number" formControlName="committee_tenure" placeholder="Enter tenure in months">
        <mat-error *ngIf="committeeForm.get('committee_tenure')?.hasError('required')">
          Committee tenure is required
        </mat-error>
        <mat-error *ngIf="committeeForm.get('committee_tenure')?.hasError('min')">
          Must be at least 1 year
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Installment Frequency -->
    <div class="form-field">
      <label class="form-label"><strong>Installment Frequency</strong></label>
      <mat-radio-group formControlName="cycle_frequency">
        <mat-radio-button value="monthly">Monthly</mat-radio-button>
        <mat-radio-button value="weekly">Weekly</mat-radio-button>
        <mat-radio-button value="semi-monthly">Semi-Monthly</mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- Submit + Cancel -->
    <div class="form-actions">
      <button mat-button color="warn" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="committeeForm.invalid">
        Save
      </button>
    </div>
  </form>
</div>
