<div class="committee-admin-container">
  <div class="dashboard-header">
    <h1>Committee Admin Dashboard</h1>
    <p>Welcome to your Committee Console</p>
  </div>

  <div class="dashboard-content">
    <div class="user-info-card">
      <h2>My Profile</h2>
      <div class="profile-details">
        <p><strong>Name:</strong> Member Name</p>
        <p><strong>Email:</strong> member@example.com</p>
        <p><strong>Role:</strong> Committee Admin</p>
      </div>
    </div>

    <div class="committees-section">
      <h2>My Committees</h2>
      <div class="committees-list">
        <div class="committee-item">
          <h3>Finance Committee</h3>
          <p>Active Member</p>
        </div>
        <div class="committee-item">
          <h3>Events Committee</h3>
          <p>Active Member</p>
        </div>
      </div>
    </div>

    <div class="actions-section">
      <h2>Quick Actions</h2>
      <div class="action-buttons">
        <button mat-raised-button color="primary">View Meetings</button>
        <button mat-raised-button color="accent">Submit Report</button>
        <button mat-raised-button color="warn">Update Profile</button>
      </div>
    </div>
  </div>
</div>
