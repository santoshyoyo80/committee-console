<form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
  <div class="container">

    <!-- First Name -->
    <div class="row">
      <label for="firstName"><strong>First Name :</strong></label>
      <input type="text" placeholder="Enter first name" formControlName="firstName" required class="form-control">
    </div>

    <!-- Last Name -->
    <div class="row">
      <label for="lastName"><strong>Last Name :</strong></label>
      <input type="text" placeholder="Enter last name" formControlName="lastName" required class="form-control">
    </div>

    <!-- Email -->
    <div class="row">
      <label for="email"><strong>Email :</strong></label>
      <input type="email" placeholder="Enter email" formControlName="email" required class="form-control">
    </div>

    <!-- Password -->
    <div class="row">
      <label for="password"><strong>Password :</strong></label>
      <input type="password" placeholder="Enter password" formControlName="password" required class="form-control">
    </div>

    <!-- Aadhaar -->
    <div class="row">
      <label for="aadhaar"><strong>Aadhaar :</strong></label>
      <input type="text" placeholder="Enter Aadhaar number" formControlName="aadhaar" class="form-control">
    </div>

    <!-- Gender -->
    <div class="row">
      <label for="gender"><strong>Gender :</strong></label>
      <select formControlName="gender" class="form-control">
        <option value="">Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>

    <!-- File Upload -->
    <div class="row">
      <label for="file"><strong>File :</strong></label>
      <input type="file" formControlName="file" required class="form-control" (change)="onFileChange($event)">
    </div>

    <!-- Submit -->
    <div style="text-align: center; margin-top: 1rem;">
      <button type="submit" class="btn btn-primary">Register</button>
    </div>
  </div>
</form>
